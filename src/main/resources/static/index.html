<!DOCTYPE html>
<html>
<head>

    <title>CRUD KTP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>

<body class="bg-light">

<div class="container mt-5">

    <h3 class="mb-4">Manajemen Data KTP</h3>

    <div id="message"></div>

    <div class="card mb-4">
        <div class="card-body">

            <input type="hidden" id="id">

            <div class="row g-2">

                <div class="col">
                    <input type="text" id="nomorKtp" class="form-control" placeholder="Nomor KTP">
                </div>

                <div class="col">
                    <input type="text" id="namaLengkap" class="form-control" placeholder="Nama Lengkap">
                </div>

                <div class="col">
                    <input type="text" id="alamat" class="form-control" placeholder="Alamat">
                </div>

                <div class="col">
                    <input type="date" id="tanggalLahir" class="form-control">
                </div>

                <div class="col">
                    <select id="jenisKelamin" class="form-control">
                        <option value="">Pilih</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>

                <div class="col">
                    <button class="btn btn-primary" onclick="saveData()">Tambah</button>
                    <button class="btn btn-warning" onclick="updateData()">Update</button>
                </div>

            </div>

        </div>
    </div>


    <div class="card">
        <div class="card-body">

            <table class="table table-bordered table-striped">

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nomor</th>
                    <th>Nama</th>
                    <th>Alamat</th>
                    <th>Tanggal</th>
                    <th>JK</th>
                    <th>Aksi</th>
                </tr>
                </thead>

                <tbody id="tableKtp"></tbody>

            </table>

        </div>
    </div>

</div>


<script>

    const API="http://localhost:8080/ktp";

    $(document).ready(function(){

    loadData();

    });


    function showMessage(msg,type){

    let alertClass="alert-success";

    if(type=="error"){
    alertClass="alert-danger";
    }

    $("#message").html(`<div class="alert ${alertClass}">${msg}</div>`);

    setTimeout(function(){
    $("#message").html("");
    },3000);

    }


    function loadData(){

    $.ajax({

    url:API,
    method:"GET",

    success:function(data){

    let rows="";

    data.forEach(function(item){

    rows+=`

    <tr>

    <td>${item.id}</td>

    <td>${item.nomorKtp}</td>

    <td>${item.namaLengkap}</td>

    <td>${item.alamat}</td>

    <td>${item.tanggalLahir}</td>

    <td>${item.jenisKelamin}</td>

    <td>

    <button class="btn btn-sm btn-warning" onclick="editData(${item.id})">Edit</button>

    <button class="btn btn-sm btn-danger" onclick="deleteData(${item.id})">Delete</button>

    </td>

    </tr>

    `;

    });

    $("#tableKtp").html(rows);

    }

    });

    }


    function saveData(){

    let data={

    nomorKtp:$("#nomorKtp").val(),
    namaLengkap:$("#namaLengkap").val(),
    alamat:$("#alamat").val(),
    tanggalLahir:$("#tanggalLahir").val(),
    jenisKelamin:$("#jenisKelamin").val()

    };

    $.ajax({

    url:API,
    method:"POST",
    contentType:"application/json",
    data:JSON.stringify(data),

    success:function(){

    showMessage("Data berhasil ditambahkan","success");

    loadData();

    clearForm();

    },

    error:function(){

    showMessage("Gagal menambah data","error");

    }

    });

    }


    function editData(id){

    $.ajax({

    url:API+"/"+id,
    method:"GET",

    success:function(data){

    $("#id").val(data.id);

    $("#nomorKtp").val(data.nomorKtp);

    $("#namaLengkap").val(data.namaLengkap);

    $("#alamat").val(data.alamat);

    $("#tanggalLahir").val(data.tanggalLahir);

    $("#jenisKelamin").val(data.jenisKelamin);

    }

    });

    }


    function updateData(){

    let id=$("#id").val();

    let data={

    nomorKtp:$("#nomorKtp").val(),
    namaLengkap:$("#namaLengkap").val(),
    alamat:$("#alamat").val(),
    tanggalLahir:$("#tanggalLahir").val(),
    jenisKelamin:$("#jenisKelamin").val()

    };

    $.ajax({

    url:API+"/"+id,
    method:"PUT",
    contentType:"application/json",
    data:JSON.stringify(data),

    success:function(){

    showMessage("Data berhasil diupdate","success");

    loadData();

    clearForm();

    },

    error:function(){

    showMessage("Gagal update data","error");

    }

    });

    }


    function deleteData(id){

    if(!confirm("Yakin hapus data?")) return;

    $.ajax({

    url:API+"/"+id,
    method:"DELETE",

    success:function(){

    showMessage("Data berhasil dihapus","success");

    loadData();

    }

    });

    }


    function clearForm(){

    $("#id").val("");
    $("#nomorKtp").val("");
    $("#namaLengkap").val("");
    $("#alamat").val("");
    $("#tanggalLahir").val("");
    $("#jenisKelamin").val("");

    }

</script>

</body>
</html>
